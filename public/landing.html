<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <meta name="description" content="Sign in to CalPal, or keep a food log on this device without an account.">
  <meta name="robots" content="noindex">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalPal">
  <link rel="apple-touch-icon" href="calorie-app-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="calorie-app-icon.png">

  <title>Sign in · CalPal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/landing.css">

  <!-- Bounce an already-signed-in visitor before anything paints. Reading the
       session synchronously here is what keeps the gate from flashing on every
       cold start of the installed PWA. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('ca:session') || 'null');
      if (s && s.kind && s.sub) location.replace('/');
    } catch (e) { /* corrupt session: fall through and show the gate */ }
  </script>

  <script type="module" src="js/landing.js"></script>
</head>
<body>

  <main class="gate">
    <div class="gate__card">

      <div class="gate__head">
        <img class="gate__mark" src="calorie-app-icon.png" alt="" width="72" height="72">
        <h1 class="gate__title">CalPal</h1>
        <p class="gate__tag">Photograph a meal, get a calorie count cross-referenced against the USDA food database.</p>
      </div>

      <div class="providers">
        <button class="idbtn idbtn--google" id="googleBtn" type="button">
          <svg class="idbtn__icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
            <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
            <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
            <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
          </svg>
          <span class="idbtn__text">Sign in with Google</span>
        </button>

        <!-- Revealed by landing.js only when the server reports an
             APPLE_SERVICE_ID. Hidden-by-default rather than hidden-on-response
             so an unconfigured deployment never flashes a button that is about
             to vanish. -->
        <button class="idbtn idbtn--apple" id="appleBtn" type="button" hidden>
          <svg class="idbtn__icon" width="17" height="20" viewBox="0 0 17 20" fill="currentColor" aria-hidden="true">
            <path d="M14.05 10.6c-.02-2.2 1.8-3.26 1.88-3.31-1.02-1.5-2.61-1.7-3.18-1.73-1.35-.14-2.64.79-3.33.79-.69 0-1.75-.77-2.87-.75-1.48.02-2.84.86-3.6 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.25 2.74 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.08 2.65-2.14.84-1.23 1.18-2.42 1.2-2.48-.03-.01-2.29-.88-2.31-3.5zM11.87 3.9c.6-.74 1.01-1.76.9-2.78-.87.04-1.93.58-2.56 1.31-.56.65-1.06 1.7-.93 2.7.97.08 1.97-.5 2.59-1.23z"/>
          </svg>
          <span class="idbtn__text">Sign in with Apple</span>
        </button>
      </div>

      <div class="gate__or"><span>or</span></div>

      <button class="guestbtn" id="guestBtn" type="button">
        <span class="guestbtn__label">Continue as guest</span>
        <span class="guestbtn__sub">No account. This log lives only on this device.</span>
      </button>

      <p class="gate__fine">
        Either way your food log is stored <strong>on this device only</strong> — there is no
        server copy. Signing in unlocks the log tied to that account here; guest keeps a
        separate one.
      </p>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
